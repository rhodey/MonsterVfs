[package]
name = "monstervfs"
version = "0.5.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"
description = "Two SQLite VFS that self-repair"
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["loadable", "parity"]
loadable = []
static = []
parity = []
copy = []
# Test fixture only: MONSTERVFS_LENIENT then absorbs rejected settings. Never for release.
lenient-pragmas = []

[dependencies]
getrandom = "=0.4.3"
libc = "=0.2.189"
xxhash-rust = { version = "=0.8.19", features = ["xxh3"] }

[build-dependencies]
cc = "=1.4.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
